<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explorá el menú de Food Store y filtrá los productos por categoría.">
  <title>La carta · Food Store</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/catalogo.js"></script>
</head>
<body>
  <a class="saltar" href="#contenido">Ir al contenido</a>
  <header class="cabecera">
    <a class="marca" href="index.html"><span class="marca__sello" aria-hidden="true">FS</span>Food Store</a>
    <nav aria-label="Navegación principal">
      <a href="index.html" aria-current="page">La carta</a>
      <a href="productos.html">Productos</a>
      <a class="enlace-boton" href="nuevo-producto.html">+ Nuevo producto</a>
    </nav>
  </header>
  <main id="contenido">
    <section class="hero" aria-labelledby="titulo">
      <img class="hero__imagen" src="img/portada.webp" alt="" width="1440" height="960" fetchpriority="high">
      <div class="hero__contenido">
        <h1 id="titulo">La <span>carta</span></h1>
        <p class="hero__texto">Hamburguesas, pizzas, acompañamientos y bebidas.</p>
        <a class="boton boton--oscuro" href="#carta">Ver menú <span aria-hidden="true">↓</span></a>
      </div>
    </section>
    <section class="carta" id="carta" aria-labelledby="titulo-carta">
      <div class="titulo-fila">
        <h2 id="titulo-carta">Menú completo</h2>
        <div class="filtro"><label for="categoria">Categoría</label><select id="categoria" disabled><option value="">Todas las categorías</option></select></div>
      </div>
      <p class="estado" id="estado" role="status" aria-live="polite">Estamos preparando la carta…</p>
      <button class="boton" id="reintentar" type="button" hidden>Reintentar</button>
      <div class="grilla" id="productos"></div>
      <nav class="paginacion" id="paginacion" aria-label="Páginas del catálogo" hidden>
        <button class="boton boton--secundario" id="anterior" type="button">← Anterior</button>
        <span id="pagina" aria-live="polite"></span>
        <button class="boton boton--secundario" id="siguiente" type="button">Siguiente →</button>
      </nav>
    </section>
  </main>
  <footer class="pie"><a class="marca" href="index.html">Food Store</a><span>Programación III</span></footer>
</body>
</html>
